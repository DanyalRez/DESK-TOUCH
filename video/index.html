<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* La palette de l'app : nuit neutre, encre claire, gris doux */
      :root {
        --ground: #0d0e11;
        --ink: #f2f2f4;
        --muted: #9a9ba4;
        --font-display: "Inter";
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; font-family: var(--font-display); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="16.2" data-width="1920" data-height="1080">
      <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html"
        data-start="0" data-duration="3.1" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="usage" data-composition-id="usage" data-composition-src="compositions/usage.html"
        data-start="2.9" data-duration="7.0" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="reglages" data-composition-id="reglages" data-composition-src="compositions/reglages.html"
        data-start="9.7" data-duration="3.5" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="fin" data-composition-id="fin" data-composition-src="compositions/fin.html"
        data-start="13.0" data-duration="3.2" data-track-index="4" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <!-- sons d'interface (Pixabay, voir assets/sfx/CREDITS.md), pic calé une image après le geste -->
      <audio id="sfx-plongee" class="clip" data-start="2.72" data-duration="0.575" data-track-index="10" data-volume="0.55" src="assets/sfx/whoosh-short.mp3"></audio>
      <audio id="sfx-prise" class="clip" data-start="7.66" data-duration="0.366" data-track-index="11" data-volume="0.7" src="assets/sfx/click-soft.mp3"></audio>
      <audio id="sfx-depot" class="clip" data-start="8.86" data-duration="0.366" data-track-index="11" data-volume="0.6" src="assets/sfx/click-soft.mp3"></audio>
      <audio id="sfx-reglages" class="clip" data-start="9.82" data-duration="0.575" data-track-index="10" data-volume="0.45" src="assets/sfx/whoosh.mp3"></audio>
      <audio id="sfx-logo" class="clip" data-start="13.31" data-duration="0.72" data-track-index="12" data-volume="0.6" src="assets/sfx/pop.mp3"></audio>
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
